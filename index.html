<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gra terenowa — promień celu</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f9;
      color: #222;
    }
    .card {
      background: white;
      padding: 1.75rem;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 92%;
    }
    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.3rem;
    }
    .progress {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
      margin: 1rem 0;
    }
    .step {
      flex: 1 1 30%;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
    }
    .step.active {
      background: #2563eb;
      color: white;
    }
    .step.done {
      background: #16a34a;
      color: white;
    }
    .target-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .target-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1d4ed8;
      font-weight: 700;
    }
    .target-box .name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 4px;
      color: #1e3a8a;
    }
    .target-box .radius-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .target-box .desc {
      font-size: 0.85rem;
      color: #334155;
      margin-top: 6px;
      line-height: 1.4;
    }
    .map-link {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      background: #ffffff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }
    .map-link:hover {
      background: #dbeafe;
    }
    .route-btn {
      display: block;
      margin-top: 0.75rem;
      padding: 10px 14px;
      background: #eef2ff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
    }
    .route-btn:hover {
      background: #e0e7ff;
    }
    .control-group {
      margin: 1rem 0;
      text-align: left;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.83rem;
      color: #475569;
    }
    button.primary {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button.primary:hover:not(:disabled) {
      background: #15803d;
    }
    .actions-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    button.secondary {
      background: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.secondary:hover {
      background: #f1f5f9;
      color: #1e293b;
    }
    #wynik {
      margin-top: 1.25rem;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .result-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .result-links a {
      color: #1d4ed8;
      font-weight: 600;
      text-decoration: none;
    }
    .result-links a:hover {
      text-decoration: underline;
    }
    .status {
      font-size: 1.05rem;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .inside {
      background: #dcfce7;
      color: #166534;
    }
    .outside {
      background: #fee2e2;
      color: #991b1b;
    }
    .finished {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Trasa: Ochota</h2>

    <div class="progress" id="progressBar"></div>

    <div class="target-box" id="targetBox">
      <div class="label">Aktualny cel</div>
      <div class="name" id="targetName">Ładowanie trasy...</div>
      <div class="radius-badge" id="targetRadius" style="display:none;"></div>
      <div class="desc" id="targetDesc"></div>
      <a class="map-link" id="targetMapLink" href="#" target="_blank" rel="noopener" style="display:none;">
        Pokaż cel w Mapach Google
      </a>
    </div>

    <div class="control-group">
      <label for="margines">
        <span>Dodatkowy margines błędu:</span>
        <span><strong id="marginesWartosc">0</strong> m</span>
      </label>
      <input type="range" id="margines" min="0" max="200" step="5" value="0">

      <div class="checkbox-row">
        <input type="checkbox" id="uwzglednijGps">
        <label for="uwzglednijGps" style="margin:0; font-weight:normal; cursor:pointer;">
          Dolicz niepewność odczytu GPS (<code>accuracy</code>)
        </label>
      </div>
    </div>

    <button class="primary" id="checkBtn" onclick="sprawdzLokalizacje()" disabled>Ładowanie...</button>

    <a class="route-btn" id="fullRouteLink" href="#" target="_blank" rel="noopener" style="display:none;">
      Otwórz całą trasę (spacer) w Mapach Google
    </a>

    <div id="wynik"></div>

    <div class="actions-row">
      <button class="secondary" onclick="wylosujNowaTrase()">Wylosuj nową trasę (3 miejsca)</button>
      <button class="secondary" onclick="powtorzTenSamZestaw()">Powtórz tę trójkę</button>
    </div>
  </div>

  <script>
    const LICZBA_CELOW_W_RUNDZIE = 3;
    const STORAGE_IDS_KEY = "ochota_wylosowane_ids_v2";
    const STORAGE_ETAP_KEY = "ochota_etap_v2";

    let wszystkieCele = [];
    let CELE = [];
    let aktualnyEtap = Number(localStorage.getItem(STORAGE_ETAP_KEY) || 0);
    let ostatniOdczyt = null;

    const suwak = document.getElementById("margines");
    const marginesLabel = document.getElementById("marginesWartosc");
    const checkboxGps = document.getElementById("uwzglednijGps");

    function odlegloscMetry(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function zbudujLinkCalejTrasy(cele, startCoords = null) {
      if (!cele || cele.length === 0) return "#";

      const ostatni = cele[cele.length - 1];
      const posrednie = cele.slice(0, -1);

      const params = new URLSearchParams({
        api: "1",
        destination: `${ostatni.lat},${ostatni.lon}`,
        travelmode: "walking"
      });

      if (posrednie.length > 0) {
        params.set(
          "waypoints",
          posrednie.map((c) => `${c.lat},${c.lon}`).join("|")
        );
      }

      if (startCoords) {
        params.set("origin", `${startCoords.lat.toFixed(6)},${startCoords.lon.toFixed(6)}`);
      }

      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function aktualizujLinkCalejTrasy() {
      const fullRouteLink = document.getElementById("fullRouteLink");
      if (!CELE || CELE.length === 0) {
        fullRouteLink.style.display = "none";
        return;
      }
      fullRouteLink.href = zbudujLinkCalejTrasy(CELE, ostatniOdczyt);
      fullRouteLink.style.display = "block";
    }

    function losujUnikalne(lista, ile) {
      const kopia = [...lista];
      for (let i = kopia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopia[i], kopia[j]] = [kopia[j], kopia[i]];
      }
      return kopia.slice(0, Math.min(ile, kopia.length));
    }

    function zapiszStanTrasy() {
      localStorage.setItem(STORAGE_IDS_KEY, JSON.stringify(CELE.map((c) => c.id)));
      localStorage.setItem(STORAGE_ETAP_KEY, String(aktualnyEtap));
    }

    function wylosujNowaTrase() {
      CELE = losujUnikalne(wszystkieCele, LICZBA_CELOW_W_RUNDZIE);
      aktualnyEtap = 0;
      ostatniOdczyt = null;
      document.getElementById("wynik").innerHTML = "";
      zapiszStanTrasy();
      zbudujPasekPostepu();
      aktualizujUI();
    }

    function powtorzTenSamZestaw() {
      aktualnyEtap = 0;
      ostatniOdczyt = null;
      document.getElementById("wynik").innerHTML = "";
      localStorage.setItem(STORAGE_ETAP_KEY, "0");
