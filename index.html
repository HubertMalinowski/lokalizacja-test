<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091f36">
  <title>Zielona Warszawa | Trasy spacerowe po Ochocie</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M24 43V9M24 17l-9-8M24 23l10-10M24 30 12-6M24 34l13-6"/>
          <path d="M12 23c-7-7-1-19 11-20 13 0 22 15 12 24M12 23c-9 9-1 19 12 17 11 2 19-9 13-16"/>
        </svg>
      </div>
      <div>
        <h1>Zielona Warszawa</h1>
        <p class="hero-subtitle">Trasy spacerowe po Ochocie</p>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="tabs-shell">
      <nav class="tabs" id="tabsBar" role="tablist" aria-label="Miejsca na trasie"></nav>
    </div>

    <section class="card" aria-label="Szczegóły wybranego miejsca">
      <div class="main-layout" id="targetBox" role="tabpanel">
        <div class="photo-box" id="photoBox">
          <div class="photo-status" id="photoStatus" role="status">Ładowanie zdjęcia...</div>
          <img class="photo" id="targetPhoto" alt="" referrerpolicy="no-referrer">
        </div>

        <div class="target-content">
          <div class="target-heading">
            <span class="target-icon" id="targetIcon" aria-hidden="true"></span>
            <div class="name" id="targetName">Ładowanie trasy...</div>
          </div>
          <p class="location">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2a8 8 0 0 0-8 8c0 5.2 8 12 8 12s8-6.8 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
            </svg>
            <span id="targetLocation">Ochota, Warszawa</span>
          </p>
          <div class="desc" id="targetDesc"></div>
        </div>
      </div>

      <div class="feature-grid" id="featureGrid" aria-label="Cechy miejsca"></div>

      <div class="actions-row">
        <a class="route-btn" id="fullRouteLink" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="5" cy="18" r="2"/>
            <circle cx="19" cy="6" r="2"/>
            <path d="M7 18h5a5 5 0 0 0 0-10h-1M17 6h-3"/>
          </svg>
          <span class="action-text">Otwórz całą trasę (spacer)<br>w Mapach Google</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M14 4h6v6M20 4l-9 9M20 14v6H4V4h6"/>
          </svg>
        </a>

        <button type="button" class="secondary" id="rerollBtn">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 5h3c5 0 5 14 10 14h3M17 16l3 3-3 3M4 19h3c5 0 5-14 10-14h3M17 2l3 3-3 3"/>
          </svg>
          <span class="action-text">Wylosuj nową trasę<br><small>(3 miejsca)</small></span>
        </button>
      </div>
    </section>

    <div class="map-footer" aria-hidden="true">
      <svg viewBox="0 0 1100 140" preserveAspectRatio="none">
        <path d="M50 115 Q150 20 250 96T450 75T680 95T900 50T1070 82" fill="none" stroke="#a12639" stroke-width="3" stroke-dasharray="8 7"/>
        <g fill="#a12639" stroke="#fff" stroke-width="3">
          <path d="M250 88a12 12 0 1 1 24 0c0 8-12 21-12 21s-12-13-12-21Z"/>
          <path d="M670 75a12 12 0 1 1 24 0c0 8-12 21-12 21s-12-13-12-21Z"/>
          <path d="M1000 74a12 12 0 1 1 24 0c0 8-12 21-12 21s-12-13-12-21Z"/>
        </g>
      </svg>
    </div>

    <p class="footer-text">Odkrywaj Ochotę krok po kroku</p>
  </main>

  <script src="./icons.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
