<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trasa — wybór celów</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem 0;
      background: #f4f4f9;
      color: #222;
    }
    .card {
      background: white;
      padding: 1.75rem;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 92%;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 1rem;
    }
    .tab-btn {
      flex: 1 1 30%;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
      border: none;
      cursor: pointer;
    }
    .tab-btn:hover {
      background: #cbd5e1;
      color: #1e293b;
    }
    .tab-btn.active {
      background: #2563eb;
      color: white;
    }
    .target-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .target-box .name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e3a8a;
    }
    .photo-status {
      font-size: 0.78rem;
      color: #475569;
      margin-top: 8px;
      display: none;
    }
    .target-box .photo {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid #bfdbfe;
      display: none;
      background: #e2e8f0;
    }
    .target-box .desc {
      font-size: 0.88rem;
      color: #334155;
      margin-top: 10px;
      line-height: 1.45;
      text-align: left;
    }
    .route-btn {
      display: block;
      padding: 12px 14px;
      background: #eef2ff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
    }
    .route-btn:hover {
      background: #e0e7ff;
    }
    .actions-row {
      display: flex;
      justify-content: center;
      margin-top: 1.15rem;
    }
    button.secondary {
      background: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button.secondary:hover {
      background: #f1f5f9;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tabs" id="tabsBar"></div>

    <div class="target-box" id="targetBox">
      <div class="name" id="targetName">Ładowanie trasy...</div>
      <div class="photo-status" id="photoStatus">Ładowanie zdjęcia...</div>
      <img class="photo" id="targetPhoto" alt="" referrerpolicy="no-referrer">
      <div class="desc" id="targetDesc"></div>
    </div>

    <a class="route-btn" id="fullRouteLink" href="#" target="_blank" rel="noopener" style="display:none;">
      Otwórz całą trasę (spacer) w Mapach Google
    </a>

    <div class="actions-row">
      <button class="secondary" onclick="wylosujNowaTrase()">Wylosuj nową trasę (3 miejsca)</button>
    </div>
  </div>

  <script>
    const LICZBA_CELOW_W_RUNDZIE = 3;
    const STORAGE_IDS_KEY = "ochota_wylosowane_ids_v3";
    const STORAGE_WYBRANY_KEY = "ochota_wybrany_indeks_v3";

    let wszystkieCele = [];
    let CELE = [];
    let wybranyIndeks = Number(localStorage.getItem(STORAGE_WYBRANY_KEY) || 0);

    function zbudujLinkCalejTrasy(cele) {
      if (!cele || cele.length === 0) return "#";

      const ostatni = cele[cele.length - 1];
      const posrednie = cele.slice(0, -1);

      const params = new URLSearchParams({
        api: "1",
        destination: `${ostatni.lat},${ostatni.lon}`,
        travelmode: "walking"
      });

      if (posrednie.length > 0) {
        params.set(
          "waypoints",
          posrednie.map((c) => `${c.lat},${c.lon}`).join("|")
        );
      }

      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function losujUnikalne(lista, ile) {
      const kopia = [...lista];
      for (let i = kopia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopia[i], kopia[j]] = [kopia[j], kopia[i]];
      }
      return kopia.slice(0, Math.min(ile, kopia.length));
    }

    function zapiszStan() {
      localStorage.setItem(STORAGE_IDS_KEY, JSON.stringify(CELE.map((c) => c.id)));
      localStorage.setItem(STORAGE_WYBRANY_KEY, String(wybranyIndeks));
    }

    function wybierzCel(idx) {
      if (idx < 0 || idx >= CELE.length) return;
      wybranyIndeks = idx;
      localStorage.setItem(STORAGE_WYBRANY_KEY, String(wybranyIndeks));
      aktualizujUI();
    }

    function wylosujNowaTrase() {
      CELE = losujUnikalne(wszystkieCele, LICZBA_CELOW_W_RUNDZIE);
      wybranyIndeks = 0;
      zapiszStan();
      zbudujPrzelaczniki();
      aktualizujUI();
    }

    function zbudujPrzelaczniki() {
      const tabsBar = document.getElementById("tabsBar");
      tabsBar.innerHTML = "";

      CELE.forEach((cel, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn";
        btn.id = `tab-${idx}`;
        btn.textContent = `${idx + 1}. ${cel.nazwa}`;
        btn.addEventListener("click", () => wybierzCel(idx));
        tabsBar.appendChild(btn);
      });
    }

    function ustawZdjecie(cel) {
      const photoEl = document.getElementById("targetPhoto");
      const statusEl = document.getElementById("photoStatus");

      if (!cel.zdjecie) {
        photoEl.onload = null;
        photoEl.onerror = null;
        photoEl.removeAttribute("src");
        photoEl.style.display = "none";
        statusEl.style.display = "none";
        return;
      }

      photoEl.style.display = "none";
      statusEl.textContent = "Ładowanie zdjęcia...";
      statusEl.style.display = "block";

      photoEl.onload = () => {
        statusEl.style.display = "none";
        photoEl.style.display = "block";
      };

      photoEl.onerror = () => {
        statusEl.style.display = "none";
        photoEl.style.display = "none";
      };

      photoEl.alt = cel.nazwa;
      photoEl.src = cel.zdjecie;
    }

    function aktualizujUI() {
      if (!CELE.length) return;

      if (wybranyIndeks < 0 || wybranyIndeks >= CELE.length) {
        wybranyIndeks = 0;
      }

      CELE.forEach((_, idx) => {
        const btn = document.getElementById(`tab-${idx}`);
        if (btn) {
          btn.classList.toggle("active", idx === wybranyIndeks);
        }
      });

      const cel = CELE[wybranyIndeks];
      document.getElementById("targetName").textContent = cel.nazwa;
      document.getElementById("targetDesc").textContent = cel.opis || "";
      ustawZdjecie(cel);

      const fullRouteLink = document.getElementById("fullRouteLink");
      fullRouteLink.href = zbudujLinkCalejTrasy(CELE);
      fullRouteLink.style.display = "block";
    }

    async function zaladujCele() {
      try {
        const response = await fetch("./cele.json");
        if (!response.ok) throw new Error(`Błąd HTTP: ${response.status}`);
        wszystkieCele = await response.json();

        if (!Array.isArray(wszystkieCele) || wszystkieCele.length === 0) {
          throw new Error("Brak celów w cele.json");
        }

        const zapisaneIdsRaw = localStorage.getItem(STORAGE_IDS_KEY);
        let odtworzone = null;

        if (zapisaneIdsRaw) {
          const zapisaneIds = JSON.parse(zapisaneIdsRaw);
          if (Array.isArray(zapisaneIds) && zapisaneIds.length > 0) {
            const mapa = new Map(wszystkieCele.map((c) => [c.id, c]));
            const dopasowane = zapisaneIds.map((id) => mapa.get(id)).filter(Boolean);
            if (dopasowane.length === zapisaneIds.length) {
              odtworzone = dopasowane;
            }
          }
        }

        if (odtworzone) {
          CELE = odtworzone;
          if (wybranyIndeks >= CELE.length) {
            wybranyIndeks = 0;
          }
        } else {
          CELE = losujUnikalne(wszystkieCele, LICZBA_CELOW_W_RUNDZIE);
          wybranyIndeks = 0;
          zapiszStan();
        }

        zbudujPrzelaczniki();
        aktualizujUI();
      } catch (err) {
        document.getElementById("targetName").textContent = "Błąd wczytywania trasy";
        document.getElementById("targetDesc").textContent =
          "Nie udało się wczytać pliku cele.json. Upewnij się, że strona działa przez serwer (np. GitHub Pages) i plik cele.json leży obok index.html.";
        document.getElementById("fullRouteLink").style.display = "none";
        console.error(err);
      }
    }

    zaladujCele();
  </script>

</body>
</html>
