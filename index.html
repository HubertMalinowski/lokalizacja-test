<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gra terenowa — Ochota</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f9;
      color: #222;
    }
    .card {
      background: white;
      padding: 1.75rem;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 92%;
    }
    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.3rem;
    }
    .progress {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin: 1rem 0;
    }
    .step {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
    }
    .step.active {
      background: #2563eb;
      color: white;
    }
    .step.done {
      background: #16a34a;
      color: white;
    }
    .target-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .target-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1d4ed8;
      font-weight: 700;
    }
    .target-box .name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 4px;
      color: #1e3a8a;
    }
    .control-group {
      margin: 1rem 0;
      text-align: left;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.83rem;
      color: #475569;
    }
    button.primary {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button.primary:hover {
      background: #15803d;
    }
    button.secondary {
      background: transparent;
      color: #64748b;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.25rem;
    }
    button.secondary:hover {
      background: #f1f5f9;
      color: #334155;
    }
    #wynik {
      margin-top: 1.25rem;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .status {
      font-size: 1.05rem;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .inside {
      background: #dcfce7;
      color: #166534;
    }
    .outside {
      background: #fee2e2;
      color: #991b1b;
    }
    .finished {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Trasa: Ochota</h2>

    <div class="progress">
      <div class="step" id="step-0">1. Pięciu Sióstr</div>
      <div class="step" id="step-1">2. Szczęśliwicki</div>
      <div class="step" id="step-2">3. Blue City</div>
    </div>

    <div class="target-box" id="targetBox">
      <div class="label">Aktualny cel</div>
      <div class="name" id="targetName">Park Pięciu Sióstr</div>
    </div>

    <div class="control-group">
      <label for="margines">
        <span>Margines błędu:</span>
        <span><strong id="marginesWartosc">50</strong> m</span>
      </label>
      <input type="range" id="margines" min="0" max="500" step="10" value="50">

      <div class="checkbox-row">
        <input type="checkbox" id="uwzglednijGps" checked>
        <label for="uwzglednijGps" style="margin:0; font-weight:normal; cursor:pointer;">
          Dolicz niepewność odczytu GPS (<code>accuracy</code>)
        </label>
      </div>
    </div>

    <button class="primary" id="checkBtn" onclick="sprawdzLokalizacje()">Sprawdź moją pozycję</button>
    <div id="wynik"></div>

    <button class="secondary" onclick="resetujGre()">Zacznij trasę od nowa</button>
  </div>

  <script>
    // Definicja 3 kolejnych etapów trasy z wielokątami granic [lat, lon]
    const CELE = [
      {
        nazwa: "Park Pięciu Sióstr",
        polygon: [
          [52.21625, 20.96520],
          [52.21640, 20.96815],
          [52.21435, 20.96935],
          [52.21345, 20.96755],
          [52.21415, 20.96545]
        ]
      },
      {
        nazwa: "Park Szczęśliwicki",
        polygon: [
          [52.21020, 20.95580], // płn-zach (okolice Włodarzewskiej / Drawskiej)
          [52.21040, 20.96280], // płn-wsch (okolice Drawskiej / Szczęśliwickiej)
          [52.20650, 20.96420], // wschód (przy ul. Szczęśliwickiej)
          [52.20360, 20.96220], // płd-wsch (okolice Dickensa / Urbanistów)
          [52.20390, 20.95540], // płd-zach (okolice Włodarzewskiej)
          [52.20720, 20.95460]  // zachód
        ]
      },
      {
        nazwa: "CH Blue City",
        polygon: [
          [52.21415, 20.95410], // płn-zach (Al. Jerozolimskie)
          [52.21335, 20.95715], // płn-wsch (Al. Jerozolimskie / Opaczewska)
          [52.21165, 20.95645], // płd-wsch (Opaczewska)
          [52.21235, 20.95335]  // płd-zach
        ]
      }
    ];

    let aktualnyEtap = Number(localStorage.getItem("ochota_etap") || 0);
    let ostatniOdczyt = null;

    const suwak = document.getElementById("margines");
    const marginesLabel = document.getElementById("marginesWartosc");
    const checkboxGps = document.getElementById("uwzglednijGps");

    aktualizujUI();

    suwak.addEventListener("input", () => {
      marginesLabel.textContent = suwak.value;
      if (ostatniOdczyt && aktualnyEtap < CELE.length) {
        ocenPozycje(ostatniOdczyt.lat, ostatniOdczyt.lon, ostatniOdczyt.acc);
      }
    });

    checkboxGps.addEventListener("change", () => {
      if (ostatniOdczyt && aktualnyEtap < CELE.length) {
        ocenPozycje(ostatniOdczyt.lat, ostatniOdczyt.lon, ostatniOdczyt.acc);
      }
    });

    function aktualizujUI() {
      for (let i = 0; i < CELE.length; i++) {
        const el = document.getElementById(`step-${i}`);
        el.className = "step";
        if (i < aktualnyEtap) el.classList.add("done");
        else if (i === aktualnyEtap) el.classList.add("active");
      }

      const targetBox = document.getElementById("targetBox");
      const targetName = document.getElementById("targetName");
      const checkBtn = document.getElementById("checkBtn");

      if (aktualnyEtap >= CELE.length) {
        targetBox.style.background = "#dcfce7";
        targetBox.style.borderColor = "#86efac";
        targetName.textContent = "Wszystkie 3 punkty zaliczone!";
        checkBtn.disabled = true;
        checkBtn.style.opacity = "0.6";
        checkBtn.textContent = "Trasa ukończona";
      } else {
        targetBox.style.background = "#eff6ff";
        targetBox.style.borderColor = "#bfdbfe";
        targetName.textContent = CELE[aktualnyEtap].nazwa;
        checkBtn.disabled = false;
        checkBtn.style.opacity = "1";
        checkBtn.textContent = `Sprawdź: ${CELE[aktualnyEtap].nazwa}`;
      }
    }

    function sprawdzLokalizacje() {
      const wynik = document.getElementById("wynik");

      if (!navigator.geolocation) {
        wynik.textContent = "Twoja przeglądarka nie obsługuje geolokalizacji.";
        return;
      }

      wynik.textContent = "Pobieranie lokalizacji...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          ostatniOdczyt = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            acc: position.coords.accuracy
          };
          ocenPozycje(ostatniOdczyt.lat, ostatniOdczyt.lon, ostatniOdczyt.acc);
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              wynik.textContent = "Odmówiono dostępu do lokalizacji.";
              break;
            case error.POSITION_UNAVAILABLE:
              wynik.textContent = "Informacje o lokalizacji są niedostępne.";
              break;
            case error.TIMEOUT:
              wynik.textContent = "Upłynął limit czasu żądania.";
              break;
            default:
              wynik.textContent = "Wystąpił nieznany błąd.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function ocenPozycje(lat, lon, acc) {
      const wynik = document.getElementById("wynik");
      if (aktualnyEtap >= CELE.length) return;

      const cel = CELE[aktualnyEtap];
      const marginesSuwak = Number(suwak.value);
      const gpsBonus = checkboxGps.checked ? Math.round(acc) : 0;
      const calkowityMargines = marginesSuwak + gpsBonus;

      const dystans = odlegloscOdWielokataMetry(lat, lon, cel.polygon);
      const trafiony = dystans <= calkowityMargines;

      let statusHtml = "";

      if (trafiony) {
        const zaliczonyNazwa = cel.nazwa;
        aktualnyEtap++;
        localStorage.setItem("ochota_etap", String(aktualnyEtap));
        aktualizujUI();

        if (aktualnyEtap < CELE.length) {
          statusHtml = `
            <div class="status inside">
              Zaliczono: ${zaliczonyNazwa}!<br>
              Nowy cel: <strong>${CELE[aktualnyEtap].nazwa}</strong>
            </div>
          `;
        } else {
          statusHtml = `
            <div class="status finished">
              Gratulacje! Dotarłeś do Blue City i ukończyłeś całą trasę!
            </div>
          `;
        }
      } else {
        statusHtml = `
          <div class="status outside">
            Jeszcze nie dotarłeś do celu: ${cel.nazwa}.
          </div>
        `;
      }

      wynik.innerHTML = `
        ${statusHtml}
        <strong>Odległość do celu (${cel.nazwa}):</strong> ${Math.round(dystans)} m<br>
        <strong>Zastosowany bufor:</strong> ${calkowityMargines} m
        (suwak: ${marginesSuwak} m${checkboxGps.checked ? ` + GPS: ${gpsBonus} m` : ""})<br>
        <strong>Twoje GPS:</strong> ${lat.toFixed(6)}, ${lon.toFixed(6)} (±${Math.round(acc)} m)<br><br>
        <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">
          Pokaż moją pozycję na mapie
        </a>
      `;
    }

    function resetujGre() {
      aktualnyEtap = 0;
      ostatniOdczyt = null;
      localStorage.removeItem("ochota_etap");
      document.getElementById("wynik").innerHTML = "";
      aktualizujUI();
    }

    function czyPunktWWielokacie(lat, lon, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][0], yi = polygon[i][1];
        const xj = polygon[j][0], yj = polygon[j][1];

        const intersect = ((yi > lon) !== (yj > lon)) &&
          (lat < (xj - xi) * (lon - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function odlegloscOdWielokataMetry(lat, lon, polygon) {
      if (czyPunktWWielokacie(lat, lon, polygon)) {
        return 0;
      }

      const R = 6371000;
      const latRad = lat * Math.PI / 180;
      const toXY = ([pLat, pLon]) => ({
        x: (pLon - lon) * (Math.PI / 180) * R * Math.cos(latRad),
        y: (pLat - lat) * (Math.PI / 180) * R
      });

      let minDist = Infinity;
      for (let i = 0; i < polygon.length; i++) {
        const a = toXY(polygon[i]);
        const b = toXY(polygon[(i + 1) % polygon.length]);
        const dist = odlegloscOdOdcinka(0, 0, a.x, a.y, b.x, b.y);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    function odlegloscOdOdcinka(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const lenSq = dx * dx + dy * dy;
      let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const projX = ax + t * dx;
      const projY = ay + t * dy;
      return Math.hypot(px - projX, py - projY);
    }
  </script>

</body>
</html>
