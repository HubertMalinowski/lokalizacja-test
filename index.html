<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SPACEROWO-WWA</title>
  <style>
    :root {
      --bg: #f5ecdf;
      --surface: #fffbf5;
      --surface-alt: #eadcca;
      --ink: #35252a;
      --ink-muted: #7c6669;
      --line: #dcc8b8;
      --accent: #76243e;
      --accent-hover: #59192e;
      --accent-soft: #f1e0e2;
      --warm: #76243e;
      --warm-soft: #f1e0e2;
      --danger-bg: #fdf1f0;
      --danger-line: #f3c6c2;
      --danger-ink: #8f241c;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow: 0 12px 32px rgba(53, 37, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100dvh;
      padding:
        max(1.1rem, env(safe-area-inset-top))
        max(0.85rem, env(safe-area-inset-right))
        max(1.75rem, env(safe-area-inset-bottom))
        max(0.85rem, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 15% 0%, rgba(118, 36, 62, 0.07), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(180, 143, 102, 0.07), transparent 40%),
        var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      min-width: 0;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: clamp(0.95rem, 3.2vw, 1.35rem);
      container-type: inline-size;
      transition: max-width 0.2s ease;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: clamp(0.72rem, 2.2cqw, 0.84rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warm);
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .route-hint {
      font-size: clamp(0.7rem, 2cqw, 0.78rem);
      color: var(--ink-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .change-district-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .change-district-btn:hover {
      background: #e1cdb9;
      border-color: #c6a591;
    }

    /* Ekran wyboru dzielnicy */
    .district-screen {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .district-intro {
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 0.95rem 1rem;
    }

    .district-title {
      margin: 0;
      font-size: clamp(1.1rem, 4.4cqw, 1.35rem);
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    .district-sub {
      margin: 0.4rem 0 0;
      font-size: clamp(0.84rem, 2.9cqw, 0.92rem);
      line-height: 1.5;
      color: var(--ink-muted);
    }

    .district-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.55rem;
    }

    .district-btn {
      appearance: none;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      text-align: left;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .district-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(118, 36, 62, 0.1);
    }

    .district-btn:active {
      transform: scale(0.99);
    }

    .district-btn-name {
      font-size: clamp(0.95rem, 3.4cqw, 1.05rem);
      font-weight: 800;
      color: var(--ink);
    }

    .district-btn-meta {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-msg {
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      background: var(--danger-bg);
      border: 1px solid var(--danger-line);
      color: var(--danger-ink);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* Ekran trasy */
    .route-screen {
      display: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--ink-muted);
      border-radius: var(--radius-md);
      padding: 0.58rem 0.5rem;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-height: 62px;
      min-width: 0;
      overflow: hidden;
    }

    .tab-btn:hover {
      border-color: #c6a591;
      color: var(--ink);
    }

    .tab-btn:active {
      transform: scale(0.98);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(118, 36, 62, 0.22);
    }

    .tab-num {
      font-size: clamp(0.64rem, 1.8cqw, 0.72rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }

    .tab-title {
      font-size: clamp(0.72rem, 2.2cqw, 0.84rem);
      font-weight: 700;
      line-height: 1.22;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    .place-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      container-type: inline-size;
    }

    .media-wrap {
      position: relative;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .place-badge {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      z-index: 2;
      background: rgba(53, 37, 42, 0.82);
      backdrop-filter: blur(6px);
      color: #fffbf5;
      font-size: clamp(0.68rem, 1.8cqw, 0.76rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      max-width: calc(100% - 1.3rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: none;
    }

    .photo-status {
      font-size: clamp(0.76rem, 2.2cqw, 0.84rem);
      color: var(--ink-muted);
      padding: 0.9rem 1rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .photo-status.error {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border-top: 1px solid var(--danger-line);
    }

    .photo-status a {
      color: var(--accent);
      font-weight: 600;
    }

    .place-body {
      padding: clamp(0.9rem, 3.2cqw, 1.25rem);
      min-width: 0;
      container-type: inline-size;
    }

    .place-name {
      margin: 0;
      font-size: clamp(1.08rem, 4.8cqw, 1.45rem);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--ink);
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    .place-coords {
      margin-top: 0.35rem;
      font-size: clamp(0.7rem, 2.1cqw, 0.78rem);
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .place-desc {
      margin: 0.75rem 0 0;
      font-size: clamp(0.86rem, 3.1cqw, 0.98rem);
      line-height: 1.58;
      color: #4c353c;
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .route-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 0.8rem 1.15rem;
      border: 1px solid #dadce0;
      border-radius: 999px;
      background: #fff;
      color: #1967d2;
      font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
      font-size: clamp(0.84rem, 3cqw, 0.96rem);
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.12);
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }

    .route-btn:hover {
      background: #f8faff;
      border-color: #c2d7f5;
      box-shadow: 0 2px 5px rgba(60, 64, 67, 0.18);
    }

    .route-btn:focus-visible {
      outline: 3px solid #1a73e8;
      outline-offset: 3px;
    }

    .route-btn:active {
      background: #e8f0fe;
      transform: scale(0.99);
    }

    .route-btn-icon {
      width: 24px;
      height: 32px;
      flex-shrink: 0;
    }

    .route-btn-label {
      min-width: 0;
      overflow-wrap: break-word;
    }




    /* Gdy szerokość ekranu jest większa niż wysokość (landscape): obrazek i opis obok siebie */
    @media (orientation: landscape) {
      body {
        align-items: center;
      }

      .app {
        max-width: min(860px, 94vw);
      }

      .district-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .place-card {
        display: grid;
        grid-template-columns: minmax(220px, 44%) minmax(0, 1fr);
        align-items: stretch;
      }

      .media-wrap {
        border-bottom: none;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 220px;
      }

      .photo {
        height: 100%;
        min-height: 220px;
        max-height: 320px;
      }

      .place-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 1.1rem 1.25rem;
      }

      .actions {
        flex-direction: row;
      }

      .route-btn {
        flex: 2;
      }

    }

    .app.district-mode { max-width: 820px; }
    .district-map-wrap { background: #f5ecdf; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0.5rem; }
    .warsaw-map { display: block; width: 100%; max-height: 67dvh; min-height: 300px; }
    .map-district { cursor: pointer; outline: none; }
    .map-district path { fill: #e2c8ab; stroke: #fffbf5; stroke-width: 2; stroke-linejoin: round; fill-rule: evenodd; transition: fill 0.15s ease; }
    .map-district:nth-of-type(3n) path { fill: #d4b391; }
    .map-district.is-empty path { fill: #e8dccb; }
    .map-district:hover path, .map-district:focus path { fill: #76243e; stroke: #59192e; stroke-width: 2.5; }
    .map-labels text { fill: #76243e; font-size: 12px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; pointer-events: none; paint-order: stroke; stroke: #f5ecdf; stroke-width: 2px; stroke-linejoin: round; }
    .map-labels { pointer-events: none; }
    .map-caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; padding: 0.6rem 0.35rem 0.15rem; font-size: 0.74rem; color: var(--ink-muted); }
    .map-caption a { color: var(--accent); }
    .map-message { margin: 0; min-height: 2.8em; padding: 0.7rem 0.85rem; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 0.85rem; line-height: 1.45; }
    .district-alternative summary { cursor: pointer; padding: 0.5rem 0; font-weight: 650; color: var(--accent); }
    .district-btn.is-empty { background: #eee2d3; }
    .district-btn.is-empty .district-btn-meta { color: var(--ink-muted); background: var(--surface-alt); }
    @media (max-width: 480px) {
      .warsaw-map { min-height: 280px; max-height: none; }
      .map-labels text { font-size: 13px; }
    }

    /* Minimalistyczna strona startowa: nazwa i mapa. */
    .site-title { display: none; }
    .site-title:focus { outline: none; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    body:has(.app.district-mode) { background: #f5ecdf; }
    .app.district-mode {
      max-width: 820px;
      padding: clamp(0.5rem, 2vw, 1.25rem);
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .district-mode .topbar {
      justify-content: center;
      margin: 0 0 clamp(1rem, 4vh, 2rem);
      padding: 0;
      border: 0;
    }
    .district-mode .brand, .district-mode .topbar-right { display: none; }
    .district-mode .site-title {
      display: block;
      margin: 0;
      color: #76243e;
      font-family: "Arial Black", "Segoe UI", sans-serif;
      font-size: clamp(1.65rem, 6.7vw, 3.5rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.065em;
      line-height: 1.15;
      white-space: nowrap;
    }
    .district-mode .district-screen { gap: 0; }
    .district-mode .district-map-wrap {
      min-width: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }
    .district-mode .warsaw-map {
      width: 100%;
      height: auto;
      min-height: 0;
      max-height: 78dvh;
    }
    .district-mode .map-labels text { stroke: #f5ecdf; }

    .route-screen { margin-top: clamp(2rem, 6vw, 3.5rem); scroll-margin-top: 1.5rem; }
    .route-heading { margin: 0 0 1rem; color: var(--accent); font-size: clamp(1.35rem, 4vw, 1.8rem); letter-spacing: -0.03em; }
    .route-heading:focus { outline: none; }
    .map-district.is-selected path { fill: var(--accent); stroke: var(--accent-hover); stroke-width: 2.5; }
    @media (prefers-reduced-motion: reduce) { .map-district path { transition: none; } }

    .district-mode .site-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      font-size: clamp(1.3rem, 5.9vw, 3.2rem);
    }
    .site-logo {
      display: block;
      width: 1.05em;
      height: 1.4em;
      flex-shrink: 0;
      background-color: currentColor;

    <!-- Trasa wybranej dzielnicy pojawia się poniżej mapy. -->
    <section class="route-screen" id="routeScreen" aria-labelledby="selectedDistrictTitle">
      <h2 class="route-heading" id="selectedDistrictTitle" tabindex="-1"></h2>

      <article class="place-card" id="targetBox">
        <div class="media-wrap" id="photoBox">
          <span class="place-badge" id="placeBadge">Przystanek 1</span>
          <div class="photo-status" id="photoStatus">Ładowanie zdjęcia...</div>
          <img class="photo" id="targetPhoto" alt="" referrerpolicy="no-referrer">
        </div>

        <div class="place-body">
          <h3 class="place-name" id="targetName" tabindex="-1">Ładowanie trasy...</h3>
          <div class="place-coords" id="targetCoords"></div>
          <p class="place-desc" id="targetDesc"></p>
        </div>
      </article>

      <div class="actions">
        <a class="route-btn" id="fullRouteLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Pokaż całą trasę spacerową w Mapach Google (otwiera się w nowej karcie)" style="display:none;">
          <svg class="route-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" aria-hidden="true" focusable="false">

                <path d="M12 0C5.37 0 0 5.37 0 12c0 8 9 14 10.5 18.5a1.58 1.58 0 0 0 3 0C15 26 24 20 24 12 24 5.37 18.63 0 12 0Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#google-maps-pin-clip)">
              <path fill="#34a853" d="M0 0h24v32H0z"/>
              <path fill="#4285f4" d="M0 0h24v7L7 24 0 17z"/>
              <path fill="#1a73e8" d="M0 0h17L0 17z"/>
              <path fill="#ea4335" d="m0 5 8 8-8 8z"/>
              <path fill="#fbbc04" d="m0 21 8-8 5 5L0 31z"/>

            <circle cx="12" cy="12" r="4.5" fill="#fff"/>
          </svg>
          <span class="route-btn-label">Pokaż trasę w Mapach Google</span>

  </main>

  <script>
    const LICZBA_CELOW_W_RUNDZIE = 3;

    let wszystkieCele = [];
    let stanCelow = "loading";

    function kluczDzielnicy(nazwa) {
      return String(nazwa || "Pozostałe").trim().toLocaleLowerCase("pl").replace(/ł/g, "l").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    }

    function wybierzDzielniceZMapy(nazwa) {
      const message = document.getElementById("districtMessage");
      if (stanCelow !== "ready") {
        message.textContent = stanCelow === "loading" ? "Trwa wczytywanie miejsc. Spróbuj za chwilę." : "Nie udało się wczytać cele.json. Umieść go obok index.html i otwórz stronę przez serwer.";
        window.alert(message.textContent);
        return;
      }
      const cele = pobierzCeleWDzielnicy(nazwa);
      if (!cele.length) {
        message.textContent = `${nazwa}: brak miejsc do spaceru. Wybierz inną dzielnicę lub dodaj miejsca tej dzielnicy do cele.json.`;
        window.alert(message.textContent);
        return;
      }
      wybierzDzielniceILosuj(nazwa);
      const heading = document.getElementById("selectedDistrictTitle");
      heading.focus({ preventScroll: true });
      document.getElementById("routeScreen").scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth",
        block: "start"
      });
    }

    function przygotujMape() {
      document.getElementById("districtList").textContent = "Wczytywanie miejsc…";
      document.querySelectorAll(".map-district").forEach((region) => {
        region.setAttribute("aria-pressed", "false");
        const wybierz = () => wybierzDzielniceZMapy(region.dataset.district);
        region.addEventListener("click", wybierz);
        region.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            wybierz();
          }
        });
      });
    }

    let aktywnaDzielnica = "";
    let CELE = [];
    let wybranyIndeks = 0;
    let numerZadaniaZdjecia = 0;

    function dopasujPojedynczaLinie(el, maxPx, minPx) {
      if (!el) return;
      el.style.fontSize = `${maxPx}px`;
      let rozmiar = maxPx;
      while (el.scrollWidth > el.clientWidth && rozmiar > minPx) {
        rozmiar -= 0.5;
        el.style.fontSize = `${rozmiar}px`;
      }
    }

    function dopasujNapisyDoSzerokosci() {
      dopasujPojedynczaLinie(document.getElementById("targetCoords"), 12.5, 9.5);
      dopasujPojedynczaLinie(document.getElementById("placeBadge"), 12, 9.5);
    }

    function pobierzDzielnice(lista) {
      const licznik = new Map();
      for (const cel of lista) {
        const nazwa = (cel.dzielnica || "Pozostałe").trim();
        licznik.set(nazwa, (licznik.get(nazwa) || 0) + 1);
      }
      return [...licznik.entries()].map(([nazwa, liczba]) => ({ nazwa, liczba }));
    }

    function pobierzCeleWDzielnicy(dzielnica) {
      return wszystkieCele.filter((c) => kluczDzielnicy(c.dzielnica) === kluczDzielnicy(dzielnica));
    }

    function zbudujLinkCalejTrasy(cele) {
      if (!cele || cele.length === 0) return "#";

      const ostatni = cele[cele.length - 1];
      const posrednie = cele.slice(0, -1);

      const params = new URLSearchParams({
        api: "1",
        destination: `${ostatni.lat},${ostatni.lon}`,
        travelmode: "walking"
      });

      if (posrednie.length > 0) {
        params.set(
          "waypoints",
          posrednie.map((c) => `${c.lat},${c.lon}`).join("|")
        );
      }

      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function losujUnikalne(lista, ile) {
      const kopia = [...lista];
      for (let i = kopia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopia[i], kopia[j]] = [kopia[j], kopia[i]];
      }
      return kopia.slice(0, Math.min(ile, kopia.length));
    }

    function zbudujListeDzielnic() {
      const container = document.getElementById("districtList");
      const regions = [...document.querySelectorAll(".map-district")];
      const names = regions.map((r) => r.dataset.district);
      for (const { nazwa } of pobierzDzielnice(wszystkieCele)) {
        if (!names.some((n) => kluczDzielnicy(n) === kluczDzielnicy(nazwa))) names.push(nazwa);
      }
      container.replaceChildren();
      regions.forEach((region) => {
        const count = pobierzCeleWDzielnicy(region.dataset.district).length;
        region.classList.toggle("is-empty", count === 0);
        region.setAttribute("aria-label", `${region.dataset.district}: ${count ? count + " miejsc, otwórz trasę" : "brak miejsc"}`);
      });
      names.sort((a, b) => a.localeCompare(b, "pl")).forEach((nazwa) => {
        const count = pobierzCeleWDzielnicy(nazwa).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "district-btn" + (count ? "" : " is-empty");
        const label = document.createElement("span");
        label.className = "district-btn-name";
        label.textContent = nazwa;
        const meta = document.createElement("span");
        meta.className = "district-btn-meta";
        meta.textContent = count ? `${count} ${count === 1 ? "miejsce" : count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 12 || count % 100 > 14) ? "miejsca" : "miejsc"}` : "Brak miejsc";
        btn.append(label, meta);
        btn.addEventListener("click", () => wybierzDzielniceZMapy(nazwa));
        container.appendChild(btn);
      });
      document.getElementById("districtMessage").textContent = wszystkieCele.length ? "Wybierz dzielnicę na mapie, aby rozpocząć spacer." : "Brak miejsc w cele.json. Dodaj miejsca do wybranych dzielnic.";
    }

    function wybierzDzielniceILosuj(dzielnica) {
      const kandydaci = pobierzCeleWDzielnicy(dzielnica);
      if (kandydaci.length === 0) return;

      aktywnaDzielnica = dzielnica;
      CELE = losujUnikalne(kandydaci, LICZBA_CELOW_W_RUNDZIE);
      wybranyIndeks = 0;

      zbudujPrzelaczniki();
      document.getElementById("selectedDistrictTitle").textContent = aktywnaDzielnica;
      document.getElementById("routeScreen").style.display = "block";
      document.querySelectorAll(".map-district").forEach((region) => {
        const selected = kluczDzielnicy(region.dataset.district) === kluczDzielnicy(aktywnaDzielnica);
        region.classList.toggle("is-selected", selected);
        region.setAttribute("aria-pressed", String(selected));
      });
      aktualizujUI();
    }

    function wybierzCel(idx) {
      if (idx < 0 || idx >= CELE.length) return;
      wybranyIndeks = idx;
      aktualizujUI();
    }

    function zbudujPrzelaczniki() {
      const tabsBar = document.getElementById("tabsBar");
      tabsBar.innerHTML = "";

      CELE.forEach((cel, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn";
        btn.id = `tab-${idx}`;
        btn.innerHTML = `
          <span class="tab-num">0${idx + 1}</span>
          <span class="tab-title">${cel.nazwa}</span>
        `;
        btn.addEventListener("click", () => wybierzCel(idx));
        tabsBar.appendChild(btn);
      });

    }

    async function pobierzUrlZWikimedia(query) {
      const url = new URL("https://commons.wikimedia.org/w/api.php");
      url.searchParams.set("action", "query");
      url.searchParams.set("format", "json");
      url.searchParams.set("origin", "*");
      url.searchParams.set("generator", "search");
      url.searchParams.set("gsrnamespace", "6");
      url.searchParams.set("gsrsearch", query);
      url.searchParams.set("gsrlimit", "5");
      url.searchParams.set("prop", "imageinfo");
      url.searchParams.set("iiprop", "url|mime");
      url.searchParams.set("iiurlwidth", "800");

      const resp = await fetch(url.toString());
      if (!resp.ok) {
        throw new Error(`Błąd HTTP Wikimedia API: ${resp.status}`);
      }

      const data = await resp.json();
      const pages = data?.query?.pages ? Object.values(data.query.pages) : [];

      for (const page of pages) {
        const info = page?.imageinfo?.[0];
        if (!info) continue;
        const mime = info.mime || "";
        if (!mime.startsWith("image/") || mime.includes("svg")) continue;
        const imgUrl = info.thumburl || info.url;
        if (imgUrl) return imgUrl;
      }

      throw new Error(`Brak wyników graficznych dla zapytania: "${query}"`);
    }

    function ustawKomunikatZdjecia(html, isError = false) {
      const statusEl = document.getElementById("photoStatus");
      statusEl.innerHTML = html;
      statusEl.className = isError ? "photo-status error" : "photo-status";
      statusEl.style.display = "block";
    }

    async function ustawZdjecie(cel) {
      const taskId = ++numerZadaniaZdjecia;
      const photoBox = document.getElementById("photoBox");
      const photoEl = document.getElementById("targetPhoto");

      photoBox.style.display = "flex";
      photoEl.onload = null;
      photoEl.onerror = null;
      photoEl.style.display = "none";
      photoEl.removeAttribute("src");

      let zrodloUrl = cel.zdjecie || "";

      if (!zrodloUrl && cel.wikiQuery) {
        ustawKomunikatZdjecia(`Szukam zdjęcia w Wikimedia Commons dla: <code>${cel.wikiQuery}</code>...`);
        try {
          zrodloUrl = await pobierzUrlZWikimedia(cel.wikiQuery);
        } catch (err) {
          if (taskId !== numerZadaniaZdjecia) return;
          ustawKomunikatZdjecia(
            `<strong>Problem z pobraniem zdjęcia:</strong> ${err.message}`,
            true
          );
          return;
        }
      }

      if (taskId !== numerZadaniaZdjecia) return;

      if (!zrodloUrl) {
        ustawKomunikatZdjecia(
          `<strong>Brak zdjęcia:</strong> obiekt w <code>cele.json</code> nie ma pola <code>zdjecie</code> ani <code>wikiQuery</code>.`,
          true
        );
        return;
      }

      ustawKomunikatZdjecia(`Pobieranie obrazu z: <a href="${zrodloUrl}" target="_blank" rel="noopener">${zrodloUrl}</a>`);

      photoEl.onload = () => {
        if (taskId !== numerZadaniaZdjecia) return;
        document.getElementById("photoStatus").style.display = "none";
        photoEl.style.display = "block";
      };

      photoEl.onerror = () => {
        if (taskId !== numerZadaniaZdjecia) return;
        photoEl.style.display = "none";
        ustawKomunikatZdjecia(
          `<strong>Nie udało się załadować obrazka</strong> (błąd sieci, blokada lub niepoprawny URL).<br>Link: <a href="${zrodloUrl}" target="_blank" rel="noopener">${zrodloUrl}</a>`,
          true
        );
      };

      photoEl.alt = cel.nazwa;
      photoEl.src = zrodloUrl;
    }

    function aktualizujUI() {
      if (!CELE.length) return;

      if (wybranyIndeks < 0 || wybranyIndeks >= CELE.length) {
        wybranyIndeks = 0;
      }

      CELE.forEach((_, idx) => {
        const btn = document.getElementById(`tab-${idx}`);
        if (btn) {
          btn.classList.toggle("active", idx === wybranyIndeks);
        }
      });

      const cel = CELE[wybranyIndeks];
      document.getElementById("placeBadge").textContent = `Przystanek ${wybranyIndeks + 1} z ${CELE.length}`;
      document.getElementById("targetName").textContent = cel.nazwa;
      document.getElementById("targetCoords").textContent =
        typeof cel.lat === "number" && typeof cel.lon === "number"
          ? `${cel.lat.toFixed(5)}° N, ${cel.lon.toFixed(5)}° E`
          : "";
      document.getElementById("targetDesc").textContent = cel.opis || "";
      ustawZdjecie(cel);

      const fullRouteLink = document.getElementById("fullRouteLink");
      fullRouteLink.href = zbudujLinkCalejTrasy(CELE);
      fullRouteLink.style.display = "flex";

      requestAnimationFrame(dopasujNapisyDoSzerokosci);
    }

    async function zaladujCele() {
      try {
        const response = await fetch("./cele.json");
        if (!response.ok) throw new Error(`Błąd HTTP: ${response.status}`);
        wszystkieCele = await response.json();

        if (!Array.isArray(wszystkieCele) || wszystkieCele.length === 0) {
          throw new Error("Brak celów w cele.json");
        }

        stanCelow = "ready";
        zbudujListeDzielnic();

      } catch (err) {
        stanCelow = "error";
        document.querySelectorAll(".map-district").forEach((region) => region.classList.add("is-empty"));
        document.getElementById("districtMessage").textContent = "Mapa jest gotowa. Aby uruchomić trasy, umieść poprawny cele.json obok index.html i otwórz stronę przez serwer.";
        document.getElementById("districtList").innerHTML =
          `<div class="status-msg"><strong>Błąd wczytywania trasy:</strong> nie udało się wczytać pliku <code>cele.json</code>. Upewnij się, że strona działa przez serwer (np. GitHub Pages) i plik <code>cele.json</code> leży obok <code>index.html</code>.</div>`;
        console.error(err);
      }
    }

    window.addEventListener("resize", dopasujNapisyDoSzerokosci);
    przygotujMape();
    zaladujCele();
  </script>

</body>
</html>
